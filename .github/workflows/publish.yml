name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      # OIDC passwordless publish via npm Trusted Publisher.
      # NOTE: do NOT set `registry-url` on setup-node — it writes the GitHub
      # token into .npmrc, and npm registry answers 404 on PUT when it receives
      # an invalid bearer token. OIDC minting only needs `id-token: write`.
      - name: Publish to npm
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org/
