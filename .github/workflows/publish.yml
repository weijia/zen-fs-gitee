name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 'Debug OIDC env and npm version'
        run: |
          echo "npm version: $(npm -v)"
          echo "HAS_ID_TOKEN_URL=[${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}]"
          echo "HAS_ID_TOKEN_TOKEN=[${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}]"
          echo "--- user npmrc ---"
          cat "$HOME/.npmrc" 2>/dev/null || echo "(none)"
          echo "--- project npmrc ---"
          cat .npmrc 2>/dev/null || echo "(none)"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org/
