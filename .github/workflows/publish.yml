name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 => npm 11.x, required for OIDC / npm Trusted Publisher publish.
      # Node 22 => npm 10.9.x only supports provenance signing, not OIDC auth.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Print npm version
        run: npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      # OIDC passwordless publish via npm Trusted Publisher (no NPM_TOKEN).
      - name: Publish to npm
        run: npm publish --access public --provenance
