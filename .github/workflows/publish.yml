name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      # OIDC passwordless publish via Trusted Publisher (no NPM_TOKEN needed).
      # `id-token: write` above lets Actions mint an OIDC token that npm verifies
      # against the Trusted Publisher configured for this package on npmjs.com.
      # The old secrets.NPM_TOKEN stopped working (npm returned 404 on PUT).
      - name: Publish to npm
        run: npm publish --access public --provenance
