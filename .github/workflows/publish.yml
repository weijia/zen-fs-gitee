name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      # OIDC passwordless publish via npm Trusted Publisher (no NPM_TOKEN).
      # Requires the Trusted Publisher to be configured on npmjs.com for this
      # package: Settings -> Trusted Publisher -> GitHub Actions
      #   owner/repo: weijia/zen-fs-gitee, workflow: publish.yml
      - name: Publish to npm
        run: npm publish --access public --provenance
